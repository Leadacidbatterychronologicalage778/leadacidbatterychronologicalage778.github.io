name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AE1379: ${{ secrets.AE1379 }}
          B367FD: ${{ secrets.B367FD }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AE1379', '')
          tag_b = os.environ.get('B367FD', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- b2ef8a5cfb17a1ebcfda9ee15d -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 664e911bee706c1e89443595e1e229e9c1d6fe -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
