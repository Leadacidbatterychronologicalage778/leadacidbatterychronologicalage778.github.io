<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>求职申请追踪</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-soft: #f2ebff;
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-solid: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0, 0, 0, 0.08);
      --danger: #d70015;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.08), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    header { padding: 42px 0 24px; }

    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 650;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.24);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: rgba(255,255,255,.9);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: white; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 8px 0 18px;
    }

    .stat-card, .panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.7);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .stat-card {
      border-radius: 24px;
      padding: 22px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .stat-number {
      margin-top: 8px;
      font-size: 36px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .panel {
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 13px;
      font-weight: 650;
      color: #3a3a3c;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
      background: rgba(255,255,255,.92);
      color: var(--text);
      outline: none;
      transition: border .18s ease, box-shadow .18s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(124,58,237,.55);
      box-shadow: 0 0 0 4px rgba(124,58,237,.10);
    }

    textarea { min-height: 100px; resize: vertical; }

    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 38px; }
    .search-icon {
      position: absolute;
      left: 13px;
      bottom: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
      background: rgba(255,255,255,.55);
      border-radius: 18px;
      overflow: hidden;
    }

    th, td {
      padding: 15px 13px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      background: rgba(250,250,252,.94);
    }

    td { font-size: 14px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(124,58,237,.025); }

    .company { font-weight: 750; }
    .muted { color: var(--muted); margin-top: 4px; }

    .job-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    .job-link:hover { text-decoration: underline; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-preparing { background: #f2f2f7; color: #636366; }
    .status-applied { background: #e8f2ff; color: #0066cc; }
    .status-test { background: #fff4dc; color: #9a6700; }
    .status-interview { background: #f0e8ff; color: #6d28d9; }
    .status-offer { background: #e6f7ed; color: #137333; }
    .status-rejected { background: #ffe9ec; color: #b42318; }

    .actions { display: flex; gap: 7px; }

    .icon-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--text);
    }

    .icon-btn:hover { background: #fff; }
    .icon-btn.delete { color: var(--danger); }

    .empty {
      text-align: center;
      padding: 52px 16px 38px;
      color: var(--muted);
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px 4px;
    }

    dialog {
      width: min(700px, calc(100% - 24px));
      border: 0;
      border-radius: 26px;
      padding: 0;
      box-shadow: 0 30px 90px rgba(0,0,0,.25);
      background: rgba(255,255,255,.97);
    }

    dialog::backdrop {
      background: rgba(30,30,32,.38);
      backdrop-filter: blur(8px);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.02em;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #eeeeef;
      font-size: 21px;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 22px 24px;
    }

    .full { grid-column: 1 / -1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 24px 24px;
    }

    .required::after { content: " *"; color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: rgba(29,29,31,.92);
      color: white;
      padding: 11px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      z-index: 20;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 900px) {
      .header-row { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 640px) {
      .container { width: min(100% - 20px, 1200px); }
      header { padding-top: 26px; }
      .stats { grid-template-columns: 1fr; gap: 10px; }
      .stat-card { padding: 18px; }
      .filters { grid-template-columns: 1fr; }
      .filters .btn { width: 100%; }
      .toolbar { width: 100%; }
      .toolbar .btn { flex: 1; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-row">
      <div>
        <h1>求职申请追踪</h1>
        <p class="subtitle">清晰记录每一次申请，专注下一步机会。</p>
      </div>
      <div class="toolbar">
        <input id="importFile" type="file" accept=".xlsx,.xls,.csv" hidden />
        <button class="btn btn-secondary" id="importBtn">导入 Excel</button>
        <button class="btn btn-secondary" id="exportBtn">导出 Excel</button>
        <button class="btn btn-primary" id="addBtn">＋ 新增申请</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="申请统计">
      <article class="stat-card">
        <div class="stat-label">已申请数量</div>
        <div class="stat-number" id="appliedCount">0</div>
      </article>
      <article class="stat-card">
        <div class="stat-label">面试数量</div>
        <div class="stat-number" id="interviewCount">0</div>
      </article>
      <article class="stat-card">
        <div class="stat-label">Offer 数量</div>
        <div class="stat-number" id="offerCount">0</div>
      </article>
    </section>

    <section class="panel">
      <div class="filters">
        <div class="field search-wrap">
          <label for="searchFilter">实时搜索</label>
          <span class="search-icon">⌕</span>
          <input id="searchFilter" type="search" placeholder="搜索公司、岗位、地点或备注" />
        </div>
        <div class="field">
          <label for="statusFilter">当前状态</label>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option>准备申请</option>
            <option>已申请</option>
            <option>笔试</option>
            <option>面试</option>
            <option>Offer</option>
            <option>拒绝</option>
          </select>
        </div>
        <div class="field">
          <label for="dateFilter">申请日期</label>
          <input id="dateFilter" type="date" />
        </div>
        <div class="field">
          <label for="sortOrder">日期排序</label>
          <select id="sortOrder">
            <option value="desc">最新申请优先</option>
            <option value="asc">最早申请优先</option>
          </select>
        </div>
        <button class="btn btn-secondary" id="clearFilters">清除</button>
      </div>
    </section>

    <section class="panel">
      <p class="result-count" id="resultCount">共 0 条记录</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>公司 / 岗位</th>
              <th>地点</th>
              <th>申请日期</th>
              <th>状态</th>
              <th>岗位链接</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="applicationBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState">暂无申请记录，点击“新增申请”开始记录。</div>
    </section>
  </main>

  <dialog id="applicationDialog">
    <form id="applicationForm">
      <div class="modal-head">
        <h2 id="dialogTitle">新增申请</h2>
        <button type="button" class="close-btn" id="closeDialog" aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <div class="field">
          <label class="required" for="company">公司名称</label>
          <input id="company" name="company" required maxlength="80" />
        </div>
        <div class="field">
          <label class="required" for="position">岗位名称</label>
          <input id="position" name="position" required maxlength="80" />
        </div>
        <div class="field">
          <label for="location">工作地点</label>
          <input id="location" name="location" maxlength="80" />
        </div>
        <div class="field">
          <label class="required" for="applicationDate">申请日期</label>
          <input id="applicationDate" name="applicationDate" type="date" required />
        </div>
        <div class="field">
          <label class="required" for="status">当前状态</label>
          <select id="status" name="status" required>
            <option>准备申请</option>
            <option>已申请</option>
            <option>笔试</option>
            <option>面试</option>
            <option>Offer</option>
            <option>拒绝</option>
          </select>
        </div>
        <div class="field">
          <label for="jobLink">岗位链接</label>
          <input id="jobLink" name="jobLink" type="url" placeholder="https://example.com/job" />
        </div>
        <div class="field full">
          <label for="notes">备注</label>
          <textarea id="notes" name="notes" maxlength="500"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">保存记录</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "jobApplications.v1";
    const VALID_STATUSES = ["准备申请", "已申请", "笔试", "面试", "Offer", "拒绝"];
    const STATUS_CLASSES = {
      "准备申请": "status-preparing",
      "已申请": "status-applied",
      "笔试": "status-test",
      "面试": "status-interview",
      "Offer": "status-offer",
      "拒绝": "status-rejected"
    };

    const elements = {
      addBtn: document.getElementById("addBtn"),
      importBtn: document.getElementById("importBtn"),
      exportBtn: document.getElementById("exportBtn"),
      importFile: document.getElementById("importFile"),
      dialog: document.getElementById("applicationDialog"),
      form: document.getElementById("applicationForm"),
      dialogTitle: document.getElementById("dialogTitle"),
      closeDialog: document.getElementById("closeDialog"),
      cancelBtn: document.getElementById("cancelBtn"),
      body: document.getElementById("applicationBody"),
      empty: document.getElementById("emptyState"),
      searchFilter: document.getElementById("searchFilter"),
      statusFilter: document.getElementById("statusFilter"),
      dateFilter: document.getElementById("dateFilter"),
      sortOrder: document.getElementById("sortOrder"),
      clearFilters: document.getElementById("clearFilters"),
      resultCount: document.getElementById("resultCount"),
      appliedCount: document.getElementById("appliedCount"),
      interviewCount: document.getElementById("interviewCount"),
      offerCount: document.getElementById("offerCount"),
      toast: document.getElementById("toast")
    };

    let applications = loadApplications();
    let editingId = null;
    let toastTimer = null;

    function loadApplications() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveApplications() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
    }

    function createId() {
      return (window.crypto && typeof window.crypto.randomUUID === "function")
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function safeUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      toastTimer = setTimeout(() => elements.toast.classList.remove("show"), 2200);
    }

    function normalizeDate(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.toISOString().slice(0, 10);
      }
      if (typeof value === "number" && window.XLSX?.SSF) {
        const parsed = XLSX.SSF.parse_date_code(value);
        if (parsed) {
          return `${parsed.y}-${String(parsed.m).padStart(2, "0")}-${String(parsed.d).padStart(2, "0")}`;
        }
      }
      const text = String(value).trim().replace(/[./]/g, "-");
      const match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (!match) return "";
      return `${match[1]}-${match[2].padStart(2, "0")}-${match[3].padStart(2, "0")}`;
    }

    function getFilteredApplications() {
      const query = elements.searchFilter.value.trim().toLowerCase();
      const status = elements.statusFilter.value;
      const date = elements.dateFilter.value;
      const order = elements.sortOrder.value;

      return applications
        .filter(item => {
          const haystack = [item.company, item.position, item.location, item.notes]
            .join(" ")
            .toLowerCase();
          return (!query || haystack.includes(query))
            && (!status || item.status === status)
            && (!date || item.applicationDate === date);
        })
        .sort((a, b) => {
          const comparison = String(a.applicationDate).localeCompare(String(b.applicationDate));
          return order === "asc" ? comparison : -comparison;
        });
    }

    function render() {
      const filtered = getFilteredApplications();

      elements.body.innerHTML = filtered.map(item => {
        const link = safeUrl(item.jobLink);
        const badgeClass = STATUS_CLASSES[item.status] || "status-preparing";
        return `
          <tr>
            <td>
              <div class="company">${escapeHtml(item.company)}</div>
              <div class="muted">${escapeHtml(item.position)}</div>
            </td>
            <td>${escapeHtml(item.location || "—")}</td>
            <td>${escapeHtml(item.applicationDate || "—")}</td>
            <td><span class="badge ${badgeClass}">${escapeHtml(item.status)}</span></td>
            <td>${link ? `<a class="job-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">打开岗位 ↗</a>` : "—"}</td>
            <td>${escapeHtml(item.notes || "—")}</td>
            <td>
              <div class="actions">
                <button class="icon-btn" data-action="edit" data-id="${escapeHtml(item.id)}">编辑</button>
                <button class="icon-btn delete" data-action="delete" data-id="${escapeHtml(item.id)}">删除</button>
              </div>
            </td>
          </tr>`;
      }).join("");

      elements.empty.hidden = filtered.length > 0;
      elements.resultCount.textContent = `显示 ${filtered.length} 条，共 ${applications.length} 条记录`;
      updateStats();
    }

    function updateStats() {
      elements.appliedCount.textContent = applications.filter(item => item.status !== "准备申请").length;
      elements.interviewCount.textContent = applications.filter(item => item.status === "面试").length;
      elements.offerCount.textContent = applications.filter(item => item.status === "Offer").length;
    }

    function openForCreate() {
      editingId = null;
      elements.dialogTitle.textContent = "新增申请";
      elements.form.reset();
      document.getElementById("applicationDate").value = new Date().toISOString().slice(0, 10);
      document.getElementById("status").value = "准备申请";
      elements.dialog.showModal();
    }

    function openForEdit(id) {
      const item = applications.find(app => app.id === id);
      if (!item) return;
      editingId = id;
      elements.dialogTitle.textContent = "编辑申请";
      for (const key of ["company", "position", "location", "applicationDate", "status", "jobLink", "notes"]) {
        document.getElementById(key).value = item[key] || "";
      }
      elements.dialog.showModal();
    }

    function closeDialog() {
      elements.dialog.close();
      editingId = null;
    }

    function exportExcel() {
      if (!window.XLSX) {
        alert("Excel 功能加载失败，请检查网络后刷新页面。");
        return;
      }

      const rows = applications
        .slice()
        .sort((a, b) => String(b.applicationDate).localeCompare(String(a.applicationDate)))
        .map(item => ({
          "公司名称": item.company,
          "岗位名称": item.position,
          "工作地点": item.location || "",
          "申请日期": item.applicationDate || "",
          "当前状态": item.status,
          "岗位链接": item.jobLink || "",
          "备注": item.notes || ""
        }));

      const worksheet = XLSX.utils.json_to_sheet(rows, {
        header: ["公司名称", "岗位名称", "工作地点", "申请日期", "当前状态", "岗位链接", "备注"]
      });
      worksheet["!cols"] = [
        { wch: 20 }, { wch: 22 }, { wch: 16 }, { wch: 13 },
        { wch: 12 }, { wch: 38 }, { wch: 36 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "求职申请");
      XLSX.writeFile(workbook, `求职申请记录_${new Date().toISOString().slice(0, 10)}.xlsx`);
      showToast("Excel 已导出");
    }

    async function importExcel(file) {
      if (!window.XLSX) {
        alert("Excel 功能加载失败，请检查网络后刷新页面。");
        return;
      }

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array", cellDates: true });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: true });

        const imported = rows.map(row => {
          const company = String(row["公司名称"] ?? row["公司"] ?? "").trim();
          const position = String(row["岗位名称"] ?? row["岗位"] ?? "").trim();
          const statusRaw = String(row["当前状态"] ?? row["状态"] ?? "准备申请").trim();
          return {
            id: createId(),
            company,
            position,
            location: String(row["工作地点"] ?? row["地点"] ?? "").trim(),
            applicationDate: normalizeDate(row["申请日期"]),
            status: VALID_STATUSES.includes(statusRaw) ? statusRaw : "准备申请",
            jobLink: String(row["岗位链接"] ?? row["链接"] ?? "").trim(),
            notes: String(row["备注"] ?? "").trim()
          };
        }).filter(item => item.company && item.position);

        if (!imported.length) {
          alert("没有找到可导入的记录。请确保表格包含“公司名称”和“岗位名称”列。");
          return;
        }

        applications = [...imported, ...applications];
        saveApplications();
        render();
        showToast(`已导入 ${imported.length} 条记录`);
      } catch (error) {
        console.error(error);
        alert("导入失败，请确认文件是有效的 Excel 或 CSV 文件。");
      } finally {
        elements.importFile.value = "";
      }
    }

    elements.addBtn.addEventListener("click", openForCreate);
    elements.closeDialog.addEventListener("click", closeDialog);
    elements.cancelBtn.addEventListener("click", closeDialog);
    elements.importBtn.addEventListener("click", () => elements.importFile.click());
    elements.exportBtn.addEventListener("click", exportExcel);
    elements.importFile.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importExcel(file);
    });

    elements.form.addEventListener("submit", event => {
      event.preventDefault();
      if (!elements.form.reportValidity()) return;

      const formData = Object.fromEntries(new FormData(elements.form).entries());
      const record = {
        company: formData.company.trim(),
        position: formData.position.trim(),
        location: formData.location.trim(),
        applicationDate: formData.applicationDate,
        status: formData.status,
        jobLink: formData.jobLink.trim(),
        notes: formData.notes.trim()
      };

      if (editingId) {
        applications = applications.map(item => item.id === editingId ? { ...item, ...record } : item);
        showToast("记录已更新");
      } else {
        applications.unshift({ id: createId(), ...record });
        showToast("记录已添加");
      }

      saveApplications();
      closeDialog();
      render();
    });

    elements.body.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, id } = button.dataset;

      if (action === "edit") openForEdit(id);

      if (action === "delete") {
        const item = applications.find(app => app.id === id);
        if (item && confirm(`确定删除“${item.company} - ${item.position}”吗？`)) {
          applications = applications.filter(app => app.id !== id);
          saveApplications();
          render();
          showToast("记录已删除");
        }
      }
    });

    for (const filter of [elements.searchFilter, elements.statusFilter, elements.dateFilter, elements.sortOrder]) {
      filter.addEventListener("input", render);
      filter.addEventListener("change", render);
    }

    elements.clearFilters.addEventListener("click", () => {
      elements.searchFilter.value = "";
      elements.statusFilter.value = "";
      elements.dateFilter.value = "";
      elements.sortOrder.value = "desc";
      render();
    });

    render();
  </script>
</body>
</html>
