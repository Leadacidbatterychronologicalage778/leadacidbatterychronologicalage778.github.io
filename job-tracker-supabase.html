<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>求职申请追踪</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-soft: #f2ebff;
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.88);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0, 0, 0, 0.08);
      --danger: #d70015;
      --success: #137333;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.09), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    header { padding: 34px 0 22px; }

    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .toolbar, .account-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .account-email {
      max-width: 230px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 650;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { cursor: wait; opacity: .6; }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.24);
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: rgba(255,255,255,.92);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: white; }

    .btn-danger {
      background: #fff0f1;
      color: var(--danger);
      border: 1px solid rgba(215, 0, 21, .12);
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,.1);
      padding: 30px;
    }

    .auth-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-size: 25px;
      box-shadow: 0 12px 25px rgba(124,58,237,.25);
    }

    .auth-card h2 {
      margin: 24px 0 7px;
      font-size: 30px;
      letter-spacing: -.03em;
    }

    .auth-card .intro {
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.6;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #ededf0;
      padding: 4px;
      border-radius: 13px;
      margin-bottom: 20px;
    }

    .auth-tab {
      border: 0;
      border-radius: 10px;
      padding: 9px;
      background: transparent;
      font-weight: 650;
      color: var(--muted);
    }

    .auth-tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .auth-message {
      margin-top: 14px;
      border-radius: 13px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.5;
      background: #f2f2f7;
      color: var(--muted);
    }

    .auth-message.error { background: #fff0f1; color: #a20b1b; }
    .auth-message.success { background: #e8f7ed; color: var(--success); }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .auth-form {
      display: grid;
      gap: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 650;
      color: #3a3a3c;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
      background: rgba(255,255,255,.94);
      color: var(--text);
      outline: none;
      transition: border .18s ease, box-shadow .18s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(124,58,237,.55);
      box-shadow: 0 0 0 4px rgba(124,58,237,.10);
    }

    textarea { min-height: 100px; resize: vertical; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 8px 0 18px;
    }

    .stat-card, .panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.75);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .stat-card {
      border-radius: 24px;
      padding: 22px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .stat-number {
      margin-top: 8px;
      font-size: 36px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .panel {
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .migration-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      background: linear-gradient(135deg, rgba(124,58,237,.11), rgba(255,255,255,.85));
    }

    .migration-panel strong { display: block; margin-bottom: 5px; }
    .migration-panel p { margin: 0; color: var(--muted); font-size: 14px; }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 38px; }
    .search-icon {
      position: absolute;
      left: 13px;
      bottom: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
      background: rgba(255,255,255,.55);
      border-radius: 18px;
      overflow: hidden;
    }

    th, td {
      padding: 15px 13px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      background: rgba(250,250,252,.94);
    }

    td { font-size: 14px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(124,58,237,.025); }

    .company { font-weight: 750; }
    .muted { color: var(--muted); margin-top: 4px; }

    .job-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    .job-link:hover { text-decoration: underline; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .status-preparing { background: #f2f2f7; color: #636366; }
    .status-applied { background: #e8f2ff; color: #0066cc; }
    .status-test { background: #fff4dc; color: #9a6700; }
    .status-interview { background: #f0e8ff; color: #6d28d9; }
    .status-offer { background: #e6f7ed; color: #137333; }
    .status-rejected { background: #ffe9ec; color: #b42318; }

    .actions { display: flex; gap: 7px; }

    .icon-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.95);
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--text);
    }

    .icon-btn:hover { background: #fff; }
    .icon-btn.delete { color: var(--danger); }

    .empty {
      text-align: center;
      padding: 52px 16px 38px;
      color: var(--muted);
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px 4px;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(245,245,247,.82);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(124,58,237,.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    dialog {
      width: min(700px, calc(100% - 24px));
      border: 0;
      border-radius: 26px;
      padding: 0;
      box-shadow: 0 30px 90px rgba(0,0,0,.25);
      background: rgba(255,255,255,.98);
    }

    dialog::backdrop {
      background: rgba(30,30,32,.38);
      backdrop-filter: blur(8px);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.02em;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #eeeeef;
      font-size: 21px;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 22px 24px;
    }

    .full { grid-column: 1 / -1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 24px 24px;
    }

    .required::after { content: " *"; color: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: rgba(29,29,31,.93);
      color: white;
      padding: 11px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      z-index: 120;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 900px) {
      .header-row { align-items: flex-start; flex-direction: column; }
      .toolbar, .account-bar { justify-content: flex-start; }
      .filters { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 640px) {
      .container { width: min(100% - 20px, 1200px); }
      header { padding-top: 26px; }
      .stats { grid-template-columns: 1fr; gap: 10px; }
      .stat-card { padding: 18px; }
      .filters { grid-template-columns: 1fr; }
      .filters .btn { width: 100%; }
      .toolbar, .account-bar { width: 100%; }
      .toolbar .btn { flex: 1; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
      .migration-panel { align-items: flex-start; flex-direction: column; }
      .migration-panel .btn { width: 100%; }
      .auth-card { padding: 24px; }
    }
  </style>
</head>

<body>
  <div class="loading" id="loadingScreen">
    <div class="spinner" aria-label="正在加载"></div>
  </div>

  <section class="auth-page" id="authPage" hidden>
    <div class="auth-card">
      <div class="auth-logo">✓</div>
      <h2>欢迎回来</h2>
      <p class="intro">登录后，你的求职记录将安全保存在云端，并在不同设备间同步。</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" type="button">登录</button>
        <button class="auth-tab" id="signupTab" type="button">注册</button>
      </div>

      <form class="auth-form" id="authForm">
        <div class="field">
          <label for="authEmail">邮箱</label>
          <input id="authEmail" type="email" autocomplete="email" required placeholder="name@example.com" />
        </div>
        <div class="field">
          <label for="authPassword">密码</label>
          <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
        </div>
        <button class="btn btn-primary" id="authSubmit" type="submit">登录</button>
      </form>

      <div class="auth-message" id="authMessage">
        新用户请先注册，并在邮箱中点击确认链接。
      </div>
    </div>
  </section>

  <div id="appPage" hidden>
    <header>
      <div class="container header-row">
        <div>
          <h1>求职申请追踪</h1>
          <p class="subtitle">清晰记录每一次申请，数据已同步到云端。</p>
        </div>

        <div>
          <div class="account-bar">
            <span class="account-email" id="accountEmail"></span>
            <button class="btn btn-danger" id="signOutBtn">退出登录</button>
          </div>
          <div class="toolbar" style="margin-top:10px">
            <input id="importFile" type="file" accept=".xlsx,.xls,.csv" hidden />
            <button class="btn btn-secondary" id="importBtn">导入 Excel</button>
            <button class="btn btn-secondary" id="exportBtn">导出 Excel</button>
            <button class="btn btn-primary" id="addBtn">＋ 新增申请</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel migration-panel" id="migrationPanel" hidden>
        <div>
          <strong>发现本机旧数据</strong>
          <p id="migrationText">可以把旧版 LocalStorage 中的记录一次性迁移到云端。</p>
        </div>
        <button class="btn btn-primary" id="migrateBtn">迁移到云端</button>
      </section>

      <section class="stats" aria-label="申请统计">
        <article class="stat-card">
          <div class="stat-label">已申请数量</div>
          <div class="stat-number" id="appliedCount">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">面试数量</div>
          <div class="stat-number" id="interviewCount">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Offer 数量</div>
          <div class="stat-number" id="offerCount">0</div>
        </article>
      </section>

      <section class="panel">
        <div class="filters">
          <div class="field search-wrap">
            <label for="searchFilter">实时搜索</label>
            <span class="search-icon">⌕</span>
            <input id="searchFilter" type="search" placeholder="搜索公司、岗位、地点或备注" />
          </div>
          <div class="field">
            <label for="statusFilter">当前状态</label>
            <select id="statusFilter">
              <option value="">全部状态</option>
              <option>准备申请</option>
              <option>已申请</option>
              <option>笔试</option>
              <option>面试</option>
              <option>Offer</option>
              <option>拒绝</option>
            </select>
          </div>
          <div class="field">
            <label for="dateFilter">申请日期</label>
            <input id="dateFilter" type="date" />
          </div>
          <div class="field">
            <label for="sortOrder">日期排序</label>
            <select id="sortOrder">
              <option value="desc">最新申请优先</option>
              <option value="asc">最早申请优先</option>
            </select>
          </div>
          <button class="btn btn-secondary" id="clearFilters">清除</button>
        </div>
      </section>

      <section class="panel">
        <p class="result-count" id="resultCount">共 0 条记录</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>公司 / 岗位</th>
                <th>地点</th>
                <th>申请日期</th>
                <th>状态</th>
                <th>岗位链接</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="applicationBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState">暂无申请记录，点击“新增申请”开始记录。</div>
      </section>
    </main>
  </div>

  <dialog id="applicationDialog">
    <form id="applicationForm">
      <div class="modal-head">
        <h2 id="dialogTitle">新增申请</h2>
        <button type="button" class="close-btn" id="closeDialog" aria-label="关闭">×</button>
      </div>

      <div class="form-grid">
        <div class="field">
          <label class="required" for="company">公司名称</label>
          <input id="company" name="company" required maxlength="80" />
        </div>
        <div class="field">
          <label class="required" for="position">岗位名称</label>
          <input id="position" name="position" required maxlength="80" />
        </div>
        <div class="field">
          <label for="location">工作地点</label>
          <input id="location" name="location" maxlength="80" />
        </div>
        <div class="field">
          <label class="required" for="applicationDate">申请日期</label>
          <input id="applicationDate" name="applicationDate" type="date" required />
        </div>
        <div class="field">
          <label class="required" for="status">当前状态</label>
          <select id="status" name="status" required>
            <option>准备申请</option>
            <option>已申请</option>
            <option>笔试</option>
            <option>面试</option>
            <option>Offer</option>
            <option>拒绝</option>
          </select>
        </div>
        <div class="field">
          <label for="jobLink">岗位链接</label>
          <input id="jobLink" name="jobLink" type="url" placeholder="https://example.com/job" />
        </div>
        <div class="field full">
          <label for="notes">备注</label>
          <textarea id="notes" name="notes" maxlength="500"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">保存记录</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const SUPABASE_URL = "https://qgoapbfnkskpddzfflyp.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hKDpcXNailcKf9-Ada7VJQ_BCu4o9J7";
    const TABLE_NAME = "job_applications";
    const LEGACY_STORAGE_KEYS = ["jobApplications.v1", "jobApplications"];

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const VALID_STATUSES = ["准备申请", "已申请", "笔试", "面试", "Offer", "拒绝"];
    const STATUS_CLASSES = {
      "准备申请": "status-preparing",
      "已申请": "status-applied",
      "笔试": "status-test",
      "面试": "status-interview",
      "Offer": "status-offer",
      "拒绝": "status-rejected"
    };

    const $ = id => document.getElementById(id);
    const elements = {
      loadingScreen: $("loadingScreen"),
      authPage: $("authPage"),
      appPage: $("appPage"),
      authForm: $("authForm"),
      authEmail: $("authEmail"),
      authPassword: $("authPassword"),
      authSubmit: $("authSubmit"),
      authMessage: $("authMessage"),
      loginTab: $("loginTab"),
      signupTab: $("signupTab"),
      accountEmail: $("accountEmail"),
      signOutBtn: $("signOutBtn"),
      addBtn: $("addBtn"),
      importBtn: $("importBtn"),
      exportBtn: $("exportBtn"),
      importFile: $("importFile"),
      dialog: $("applicationDialog"),
      form: $("applicationForm"),
      dialogTitle: $("dialogTitle"),
      closeDialog: $("closeDialog"),
      cancelBtn: $("cancelBtn"),
      saveBtn: $("saveBtn"),
      body: $("applicationBody"),
      empty: $("emptyState"),
      searchFilter: $("searchFilter"),
      statusFilter: $("statusFilter"),
      dateFilter: $("dateFilter"),
      sortOrder: $("sortOrder"),
      clearFilters: $("clearFilters"),
      resultCount: $("resultCount"),
      appliedCount: $("appliedCount"),
      interviewCount: $("interviewCount"),
      offerCount: $("offerCount"),
      toast: $("toast"),
      migrationPanel: $("migrationPanel"),
      migrationText: $("migrationText"),
      migrateBtn: $("migrateBtn")
    };

    let authMode = "login";
    let currentUser = null;
    let applications = [];
    let editingId = null;
    let toastTimer = null;

    function setLoading(show) {
      elements.loadingScreen.hidden = !show;
    }

    function setAuthMessage(message, type = "") {
      elements.authMessage.textContent = message;
      elements.authMessage.className = `auth-message ${type}`.trim();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      toastTimer = setTimeout(() => elements.toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function safeUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function normalizeDate(value) {
      if (!value) return "";
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return value.toISOString().slice(0, 10);
      }
      if (typeof value === "number" && window.XLSX?.SSF) {
        const parsed = XLSX.SSF.parse_date_code(value);
        if (parsed) {
          return `${parsed.y}-${String(parsed.m).padStart(2, "0")}-${String(parsed.d).padStart(2, "0")}`;
        }
      }
      const text = String(value).trim().replace(/[./]/g, "-");
      const match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      return match
        ? `${match[1]}-${match[2].padStart(2, "0")}-${match[3].padStart(2, "0")}`
        : "";
    }

    function fromDatabase(row) {
      return {
        id: row.id,
        company: row.company || "",
        position: row.position || "",
        location: row.location || "",
        applicationDate: row.application_date || "",
        status: row.status || "准备申请",
        jobLink: row.job_link || "",
        notes: row.notes || ""
      };
    }

    function toDatabase(record) {
      return {
        company: record.company,
        position: record.position,
        location: record.location || null,
        application_date: record.applicationDate || null,
        status: record.status,
        job_link: record.jobLink || null,
        notes: record.notes || null
      };
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const isLogin = mode === "login";
      elements.loginTab.classList.toggle("active", isLogin);
      elements.signupTab.classList.toggle("active", !isLogin);
      elements.authSubmit.textContent = isLogin ? "登录" : "创建账号";
      elements.authPassword.autocomplete = isLogin ? "current-password" : "new-password";
      setAuthMessage(
        isLogin
          ? "请输入已注册的邮箱和密码。"
          : "注册后请打开验证邮件，并点击邮件中的确认链接。"
      );
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const email = elements.authEmail.value.trim();
      const password = elements.authPassword.value;

      elements.authSubmit.disabled = true;

      try {
        if (authMode === "signup") {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + window.location.pathname
            }
          });

          if (error) throw error;

          if (data.session) {
            setAuthMessage("注册成功，正在进入应用。", "success");
          } else {
            setAuthMessage("注册成功！请检查邮箱并点击确认链接，然后回来登录。", "success");
          }
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;
          setAuthMessage("登录成功。", "success");
        }
      } catch (error) {
        console.error(error);
        setAuthMessage(translateAuthError(error.message), "error");
      } finally {
        elements.authSubmit.disabled = false;
      }
    }

    function translateAuthError(message = "") {
      const lower = message.toLowerCase();
      if (lower.includes("invalid login credentials")) return "邮箱或密码不正确。";
      if (lower.includes("email not confirmed")) return "邮箱尚未验证，请先打开验证邮件。";
      if (lower.includes("user already registered")) return "这个邮箱已经注册，请直接登录。";
      if (lower.includes("password")) return "密码不符合要求，请至少输入 6 位。";
      if (lower.includes("rate limit")) return "操作过于频繁，请稍后再试。";
      return `操作失败：${message}`;
    }

    async function signOut() {
      elements.signOutBtn.disabled = true;
      const { error } = await supabaseClient.auth.signOut();
      elements.signOutBtn.disabled = false;

      if (error) {
        alert(`退出失败：${error.message}`);
      }
    }

    async function showSignedIn(user) {
      currentUser = user;
      elements.authPage.hidden = true;
      elements.appPage.hidden = false;
      elements.accountEmail.textContent = user.email || "已登录";
      await loadApplications();
      checkLegacyData();
    }

    function showSignedOut() {
      currentUser = null;
      applications = [];
      render();
      elements.appPage.hidden = true;
      elements.authPage.hidden = false;
      elements.authPassword.value = "";
    }

    async function loadApplications() {
      if (!currentUser) return;

      setLoading(true);
      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select("*")
        .order("application_date", { ascending: false })
        .order("created_at", { ascending: false });

      setLoading(false);

      if (error) {
        console.error(error);
        alert(`读取云端数据失败：${error.message}`);
        return;
      }

      applications = (data || []).map(fromDatabase);
      render();
    }

    async function createApplication(record) {
      const { error } = await supabaseClient
        .from(TABLE_NAME)
        .insert({
          ...toDatabase(record),
          user_id: currentUser.id
        });

      if (error) throw error;
    }

    async function updateApplication(id, record) {
      const { error } = await supabaseClient
        .from(TABLE_NAME)
        .update(toDatabase(record))
        .eq("id", id);

      if (error) throw error;
    }

    async function deleteApplication(id) {
      const { error } = await supabaseClient
        .from(TABLE_NAME)
        .delete()
        .eq("id", id);

      if (error) throw error;
    }

    function getFilteredApplications() {
      const query = elements.searchFilter.value.trim().toLowerCase();
      const status = elements.statusFilter.value;
      const date = elements.dateFilter.value;
      const order = elements.sortOrder.value;

      return applications
        .filter(item => {
          const haystack = [item.company, item.position, item.location, item.notes]
            .join(" ")
            .toLowerCase();

          return (!query || haystack.includes(query))
            && (!status || item.status === status)
            && (!date || item.applicationDate === date);
        })
        .sort((a, b) => {
          const comparison = String(a.applicationDate).localeCompare(String(b.applicationDate));
          return order === "asc" ? comparison : -comparison;
        });
    }

    function render() {
      const filtered = getFilteredApplications();

      elements.body.innerHTML = filtered.map(item => {
        const link = safeUrl(item.jobLink);
        const badgeClass = STATUS_CLASSES[item.status] || "status-preparing";

        return `
          <tr>
            <td>
              <div class="company">${escapeHtml(item.company)}</div>
              <div class="muted">${escapeHtml(item.position)}</div>
            </td>
            <td>${escapeHtml(item.location || "—")}</td>
            <td>${escapeHtml(item.applicationDate || "—")}</td>
            <td><span class="badge ${badgeClass}">${escapeHtml(item.status)}</span></td>
            <td>${link ? `<a class="job-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">打开岗位 ↗</a>` : "—"}</td>
            <td>${escapeHtml(item.notes || "—")}</td>
            <td>
              <div class="actions">
                <button class="icon-btn" data-action="edit" data-id="${escapeHtml(item.id)}">编辑</button>
                <button class="icon-btn delete" data-action="delete" data-id="${escapeHtml(item.id)}">删除</button>
              </div>
            </td>
          </tr>`;
      }).join("");

      elements.empty.hidden = filtered.length > 0;
      elements.resultCount.textContent = `显示 ${filtered.length} 条，共 ${applications.length} 条记录`;
      updateStats();
    }

    function updateStats() {
      elements.appliedCount.textContent = applications.filter(
        item => item.status !== "准备申请"
      ).length;
      elements.interviewCount.textContent = applications.filter(
        item => item.status === "面试"
      ).length;
      elements.offerCount.textContent = applications.filter(
        item => item.status === "Offer"
      ).length;
    }

    function openForCreate() {
      editingId = null;
      elements.dialogTitle.textContent = "新增申请";
      elements.form.reset();
      $("applicationDate").value = new Date().toISOString().slice(0, 10);
      $("status").value = "准备申请";
      elements.dialog.showModal();
    }

    function openForEdit(id) {
      const item = applications.find(app => app.id === id);
      if (!item) return;

      editingId = id;
      elements.dialogTitle.textContent = "编辑申请";

      for (const key of [
        "company", "position", "location", "applicationDate",
        "status", "jobLink", "notes"
      ]) {
        $(key).value = item[key] || "";
      }

      elements.dialog.showModal();
    }

    function closeDialog() {
      elements.dialog.close();
      editingId = null;
    }

    async function saveForm(event) {
      event.preventDefault();
      if (!elements.form.reportValidity()) return;

      const formData = Object.fromEntries(new FormData(elements.form).entries());
      const record = {
        company: formData.company.trim(),
        position: formData.position.trim(),
        location: formData.location.trim(),
        applicationDate: formData.applicationDate,
        status: formData.status,
        jobLink: formData.jobLink.trim(),
        notes: formData.notes.trim()
      };

      elements.saveBtn.disabled = true;

      try {
        if (editingId) {
          await updateApplication(editingId, record);
          showToast("记录已更新并同步");
        } else {
          await createApplication(record);
          showToast("记录已保存到云端");
        }

        closeDialog();
        await loadApplications();
      } catch (error) {
        console.error(error);
        alert(`保存失败：${error.message}`);
      } finally {
        elements.saveBtn.disabled = false;
      }
    }

    function exportExcel() {
      if (!window.XLSX) {
        alert("Excel 功能加载失败，请检查网络后刷新页面。");
        return;
      }

      const rows = applications
        .slice()
        .sort((a, b) => String(b.applicationDate).localeCompare(String(a.applicationDate)))
        .map(item => ({
          "公司名称": item.company,
          "岗位名称": item.position,
          "工作地点": item.location || "",
          "申请日期": item.applicationDate || "",
          "当前状态": item.status,
          "岗位链接": item.jobLink || "",
          "备注": item.notes || ""
        }));

      const worksheet = XLSX.utils.json_to_sheet(rows, {
        header: ["公司名称", "岗位名称", "工作地点", "申请日期", "当前状态", "岗位链接", "备注"]
      });

      worksheet["!cols"] = [
        { wch: 20 }, { wch: 22 }, { wch: 16 }, { wch: 13 },
        { wch: 12 }, { wch: 38 }, { wch: 36 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "求职申请");
      XLSX.writeFile(
        workbook,
        `求职申请记录_${new Date().toISOString().slice(0, 10)}.xlsx`
      );

      showToast("Excel 已导出");
    }

    async function importExcel(file) {
      if (!window.XLSX) {
        alert("Excel 功能加载失败，请检查网络后刷新页面。");
        return;
      }

      elements.importBtn.disabled = true;

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: "array", cellDates: true });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {
          defval: "",
          raw: true
        });

        const imported = rows.map(row => {
          const company = String(row["公司名称"] ?? row["公司"] ?? "").trim();
          const position = String(row["岗位名称"] ?? row["岗位"] ?? "").trim();
          const statusRaw = String(
            row["当前状态"] ?? row["状态"] ?? "准备申请"
          ).trim();

          return {
            company,
            position,
            location: String(row["工作地点"] ?? row["地点"] ?? "").trim(),
            applicationDate: normalizeDate(row["申请日期"]),
            status: VALID_STATUSES.includes(statusRaw) ? statusRaw : "准备申请",
            jobLink: String(row["岗位链接"] ?? row["链接"] ?? "").trim(),
            notes: String(row["备注"] ?? "").trim()
          };
        }).filter(item => item.company && item.position);

        if (!imported.length) {
          alert("没有找到可导入的记录。请确保表格包含“公司名称”和“岗位名称”列。");
          return;
        }

        const payload = imported.map(record => ({
          ...toDatabase(record),
          user_id: currentUser.id
        }));

        const { error } = await supabaseClient
          .from(TABLE_NAME)
          .insert(payload);

        if (error) throw error;

        await loadApplications();
        showToast(`已导入并同步 ${imported.length} 条记录`);
      } catch (error) {
        console.error(error);
        alert(`导入失败：${error.message}`);
      } finally {
        elements.importFile.value = "";
        elements.importBtn.disabled = false;
      }
    }

    function getLegacyData() {
      for (const key of LEGACY_STORAGE_KEYS) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          if (Array.isArray(parsed) && parsed.length) {
            return { key, records: parsed };
          }
        } catch {}
      }
      return null;
    }

    function checkLegacyData() {
      const legacy = getLegacyData();
      elements.migrationPanel.hidden = !legacy;

      if (legacy) {
        elements.migrationText.textContent =
          `检测到 ${legacy.records.length} 条本机旧记录，可以一次性上传到当前账号。`;
      }
    }

    async function migrateLegacyData() {
      const legacy = getLegacyData();
      if (!legacy) {
        elements.migrationPanel.hidden = true;
        return;
      }

      if (!confirm(`确定把 ${legacy.records.length} 条旧记录迁移到当前云端账号吗？`)) {
        return;
      }

      elements.migrateBtn.disabled = true;

      try {
        const payload = legacy.records
          .map(item => ({
            user_id: currentUser.id,
            company: String(item.company || "").trim(),
            position: String(item.position || "").trim(),
            location: item.location || null,
            application_date: normalizeDate(
              item.applicationDate || item.application_date
            ) || null,
            status: VALID_STATUSES.includes(item.status)
              ? item.status
              : "准备申请",
            job_link: item.jobLink || item.job_link || null,
            notes: item.notes || null
          }))
          .filter(item => item.company && item.position);

        if (!payload.length) {
          throw new Error("旧数据中没有有效的公司名称和岗位名称。");
        }

        const { error } = await supabaseClient
          .from(TABLE_NAME)
          .insert(payload);

        if (error) throw error;

        localStorage.removeItem(legacy.key);
        elements.migrationPanel.hidden = true;
        await loadApplications();
        showToast(`已迁移 ${payload.length} 条旧记录`);
      } catch (error) {
        console.error(error);
        alert(`迁移失败：${error.message}\n旧数据仍保留在本机，没有被删除。`);
      } finally {
        elements.migrateBtn.disabled = false;
      }
    }

    elements.loginTab.addEventListener("click", () => switchAuthMode("login"));
    elements.signupTab.addEventListener("click", () => switchAuthMode("signup"));
    elements.authForm.addEventListener("submit", handleAuthSubmit);
    elements.signOutBtn.addEventListener("click", signOut);

    elements.addBtn.addEventListener("click", openForCreate);
    elements.closeDialog.addEventListener("click", closeDialog);
    elements.cancelBtn.addEventListener("click", closeDialog);
    elements.form.addEventListener("submit", saveForm);

    elements.importBtn.addEventListener("click", () => elements.importFile.click());
    elements.exportBtn.addEventListener("click", exportExcel);
    elements.importFile.addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importExcel(file);
    });

    elements.migrateBtn.addEventListener("click", migrateLegacyData);

    elements.body.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const { action, id } = button.dataset;

      if (action === "edit") {
        openForEdit(id);
        return;
      }

      if (action === "delete") {
        const item = applications.find(app => app.id === id);

        if (!item || !confirm(`确定删除“${item.company} - ${item.position}”吗？`)) {
          return;
        }

        button.disabled = true;

        try {
          await deleteApplication(id);
          await loadApplications();
          showToast("记录已从云端删除");
        } catch (error) {
          console.error(error);
          alert(`删除失败：${error.message}`);
          button.disabled = false;
        }
      }
    });

    for (const filter of [
      elements.searchFilter,
      elements.statusFilter,
      elements.dateFilter,
      elements.sortOrder
    ]) {
      filter.addEventListener("input", render);
      filter.addEventListener("change", render);
    }

    elements.clearFilters.addEventListener("click", () => {
      elements.searchFilter.value = "";
      elements.statusFilter.value = "";
      elements.dateFilter.value = "";
      elements.sortOrder.value = "desc";
      render();
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      window.setTimeout(async () => {
        if (session?.user) {
          await showSignedIn(session.user);
        } else {
          showSignedOut();
        }
        setLoading(false);
      }, 0);
    });

    async function initialize() {
      switchAuthMode("login");

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        setAuthMessage(`读取登录状态失败：${error.message}`, "error");
      }

      if (data.session?.user) {
        await showSignedIn(data.session.user);
      } else {
        showSignedOut();
      }

      setLoading(false);
    }

    initialize();
  </script>
</body>
</html>
